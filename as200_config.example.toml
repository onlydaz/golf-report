# One environment loaded from TOML on app restart. No endpoint selection in the UI.
# Stop collection and exit the app before changing environments. Preserve the old Journal.
# Python Simulator: use the environment values below:
# address = "127.0.0.1:1503"
# unit_id = 1
# source_key = "golf-report-simulator"
# confirmed_session_id = "simulator-test-01"
# journal_path = "local-runtime/simulator/capture.json"
# Loopback requires the simulator identity/path and a session starting "simulator-".
# Remote PLC uses the production identity/path and a non-simulator session.
# Reuse each environment's existing session when returning; never replace it to bypass RESET.
# Other parameters below apply to both environments. ACK remains independently opt-in.
# LOW/offset/timing are the current profile, not proof of Ladder validation.
enabled = false
mode = "modbus"
address = "192.168.1.5:502"
# Windows selects the route. Omit local_bind_ip to let Windows select the source IP.
# Optional: bind an IP already assigned to this laptop before connecting.
# local_bind_ip = "192.168.1.100"
# Edit PLC connection parameters here while the app is stopped, then restart it.
unit_id = 1
source_key = "golf-report-plc-01"
confirmed_session_id = "golf-report-plc-01-initial"
journal_path = "local-runtime/capture.json"
layout_profile = "as200-published-v1"
control_start = 25000
buffer_count = 2
record_size = 240
word_order = "LOW"
modbus_address_offset = 0
timeout_ms = 2000
poll_interval_ms = 500
retry_interval_ms = 2000
max_queue = 128
plc_heartbeat_timeout_ms = 5000
# Keep monitoring D25007 even when this ACK requirement is disabled.
require_plc_heartbeat_for_ack = true
auto_reconnect = true
read_only = true
allow_plc_connection = true
technical_setup_confirmed = false
ack_enabled = false
# Set these write-related options only after independent protocol/permission verification.
ack_protocol = "as200"
pc_heartbeat_enabled = false
allow_plc_heartbeat_write = false
