# Technical reference only. The QC screen creates endpoint-only settings in AppData.
# "Lưu và kết nối" reads and validates the AS200 snapshot, then hydrates runtime
# defaults and creates an internal source identity in PostgreSQL.
# This is an example address, never an automatically selected device.
mode = "modbus"
enabled = false
technical_setup_confirmed = false
address = "192.0.2.10:502"
unit_id = 7
ack_enabled = false
pc_heartbeat_enabled = false
allow_plc_connection = false
allow_plc_heartbeat_write = false

# These values are runtime defaults applied automatically after the endpoint and
# the approved AS200 snapshot are accepted. Users do not edit them.
# The source/session identity is derived internally from the endpoint.
# word_order = "LOW" # Verify on the actual device, do not copy blindly.
# modbus_address_offset = 0 # Verify D-register to PDU mapping.
# source_key = "TECHNICIAN-CONFIRMED-STABLE-SOURCE"
# confirmed_session_id = "TECHNICIAN-CONFIRMED-SESSION"
# plc_heartbeat_timeout_ms = 5000 # Example only; agree timing with PLC technician.
# journal_path = "as200_capture_journal.json"

# The release is approved once by the PLC engineer for the company's AS200
# register-map/ACK scope. FC03 alone never grants ACK permission: the app also
# requires stable control counters, two valid 240-WORD buffers, and all
# Journal/Inbox/Neon recovery guards to pass.
# PC heartbeat additionally requires pc_heartbeat_enabled=true and allow_plc_heartbeat_write=true.
# Do not enable writes until commissioning. Existing ACK evidence/session guards still apply.

# Legacy mode="simulator"/"plc" configurations remain readable without automatic conversion.
# Existing Journal/Inbox/ACK intent guards remain authoritative and are never
# cleared by the connection screen.
